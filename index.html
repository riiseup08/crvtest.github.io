<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cartographie des risques VIH – Adolescents et Jeunes</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css" />
  <!-- Leaflet MarkerCluster CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.1.0/MarkerCluster.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.1.0/MarkerCluster.Default.css" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.2.0/css/all.min.css" />
  <!-- Custom styles -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

<div id="app-container">

  <!-- HEADER -->
  <header id="header" role="banner">
    <h1>
      <i class="fas fa-map-marked-alt" style="margin-right:8px;opacity:.8"></i>
      Cartographie des risques et vulnérabilités liés au VIH chez les adolescents et jeunes
    </h1>
    <div id="header-controls">
      <button id="mobile-sidebar-btn" class="header-btn" aria-label="Ouvrir les filtres"
              title="Filtres &amp; Légende" style="display:none">
        <i class="fas fa-layer-group"></i>
      </button>
      <button id="layer-btn" class="header-btn" aria-label="Changer de fond de carte" title="Fond de carte">
        <i class="fas fa-map"></i> <span>Fond</span>
      </button>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <div id="main-content">

    <!-- Sidebar -->
    <nav id="sidebar" aria-label="Filtres et statistiques">
      <div id="sidebar-inner">

        <!-- Search -->
        <div id="search-section" role="search">
          <h6><i class="fas fa-search" style="margin-right:4px"></i>Recherche</h6>
          <input type="text" id="search-input" placeholder="Secteur, commune..." autocomplete="off"
                 aria-label="Rechercher un secteur ou une commune" />
          <div id="search-results" role="listbox" aria-live="polite"></div>
        </div>

        <!-- Category Filters -->
        <div id="filter-section">
          <div class="filter-group">
            <p class="filter-group-title"><i class="fas fa-filter" style="margin-right:4px"></i>Catégories</p>
            <div id="category-filters"></div>
          </div>

          <div class="filter-group">
            <p class="filter-group-title"><i class="fas fa-city" style="margin-right:4px"></i>Commune</p>
            <select id="commune-select" aria-label="Filtrer par commune">
              <option value="">— Toutes les communes —</option>
            </select>
          </div>

          <button id="reset-filters" title="Réinitialiser tous les filtres">
            <i class="fas fa-undo"></i> Réinitialiser les filtres
          </button>
        </div>

        <!-- Statistics -->
        <div id="stats-section" aria-label="Statistiques">
          <h6><i class="fas fa-chart-bar" style="margin-right:4px"></i>Statistiques</h6>
          <div class="stats-grid">
            <div class="stat-card stat-total">
              <div>
                <div class="stat-value" id="stat-total">–</div>
                <div class="stat-label">Sites visibles</div>
              </div>
              <i class="fas fa-map-pin" style="font-size:22px;opacity:.5"></i>
            </div>
            <div class="stat-card">
              <div class="stat-value" id="stat-communes">–</div>
              <div class="stat-label">Communes</div>
            </div>
          </div>
        </div>

      </div>
    </nav>
    <button id="sidebar-toggle" aria-label="Afficher/masquer le panneau latéral" title="Réduire">&#8249;</button>

    <!-- Map -->
    <div id="map-container">

      <div id="loading-overlay" role="status" aria-live="polite">
        <div class="spinner"></div>
        <p>Chargement des données...</p>
      </div>

      <div id="layer-switcher" role="radiogroup" aria-label="Choisir le fond de carte">
        <strong style="font-size:11px;text-transform:uppercase;color:#666;display:block;margin-bottom:6px">Fond de carte</strong>
        <label><input type="radio" name="tile-layer" value="osm" checked /> OpenStreetMap</label>
        <label><input type="radio" name="tile-layer" value="satellite" /> Satellite</label>
        <label><input type="radio" name="tile-layer" value="terrain" /> Terrain</label>
      </div>

      <div id="map" aria-label="Carte des risques VIH"></div>

    </div>

  </div>

  <!-- EXPORT BAR -->
  <div id="export-bar" role="toolbar" aria-label="Options d'export">
    <label><i class="fas fa-download" style="margin-right:4px"></i>Exporter :</label>
    <button id="export-geojson" class="export-btn" title="Télécharger les données filtrées en GeoJSON">
      <i class="fas fa-file-code"></i> <span>GeoJSON</span>
    </button>
    <button id="print-map" class="export-btn" title="Imprimer la carte">
      <i class="fas fa-print"></i> <span>Imprimer</span>
    </button>
    <span style="margin-left:auto;font-size:11px;color:#888">
      Appuyez sur <kbd>/</kbd> pour rechercher &middot; <kbd>f</kbd> pour ajuster la vue
    </span>
  </div>

</div>

<!-- Leaflet JS -->
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.1.0/leaflet.markercluster.js"></script>

<!-- Application scripts -->
<script src="js/data.js"></script>
<script src="js/map.js"></script>
<script src="js/search.js"></script>
<script src="js/stats.js"></script>
<script src="js/app.js"></script>

<script>
  if (window.innerWidth <= 768) {
    var mobileBtn = document.getElementById('mobile-sidebar-btn');
    if (mobileBtn) mobileBtn.style.display = 'flex';
  }
</script>

</body>
</html>
